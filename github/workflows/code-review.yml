name: Code Review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  pull-requests: write
jobs:
  setup-deepseek-review:
    runs-on: ubuntu-latest
    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_KEY }}